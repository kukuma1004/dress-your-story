  async function resolveEntry(entry) {
    if (entry.kind === 'face') return faceLayer();
    if (entry.kind === 'base') {
      if (state.fixtureMode) return fixtures.base;
      if (!base.asset) return null;
      // 하의·원피스를 입으면 속옷 아랫부분을 피부로 메운 몸 그림(tools/panty_fill.py) — 허리 위로 속옷이 보이지 않게
      const useCovered = entry.covered && base.asset.covered;
      const img = await loadImage(useCovered ? base.asset.covered : base.asset.src);
      const hc = hairColor();
      if (!hc.palette || !base.asset.hairMask) return img;
      return hairTinted(`hair:${base.baseId}${useCovered ? ':c' : ''}`, img, base.asset.hairMask, W, H);
    }
    const { item, colorway } = entry;
    const w = catalog.wearable(item, base, fixtureSet());
    if (!w.ok) return null;
    let src, mask, protect;
    if (w.source === 'fixture') {
      const f = fixtures.items.get(item.itemId);
      src = f.image; mask = f.mask; protect = f.protect;
    } else {
      if (colorway.mode === 'asset') return loadImage(colorway.src);
      const a = w.fit ? w.fit.asset : item.asset;
      src = await loadImage(a.src);
      mask = a.mask ? await loadImage(a.mask) : null;
      protect = a.protect ? await loadImage(a.protect) : null;
    }
    if (colorway.mode === 'original') return src;
    return tinted(`${w.source}:${base.baseId}:${item.itemId}:${colorway.colorwayId}`, src, colorway.hex, mask, protect);
  }

  // 몸 가림 마스크(정렬 공정 3): 입은 옷들의 hide.png(옷이 덮는 곳 + 옷 입힌 원화에서 배경이 된 몸 부분)를 기준 인물에서 지운 뒤 옷을 얹는다.
  // → 옷 가장자리 밖으로 몸이 비어져 나오지 않는다. hide는 목선 아래만 있어 얼굴·머리는 그대로다.
  async function withHidden(stack, bodyImg) {
    if (state.fixtureMode) return bodyImg;
    const hides = [];
    for (const e of stack) {
      if (e.kind !== 'item') continue;
      const w = catalog.wearable(e.item, base, null);
      const a = w.ok && w.fit && w.fit.asset;
      if (a && a.hide) hides.push(loadImage(a.hide));
    }
    if (!hides.length) return bodyImg;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const cx = c.getContext('2d');
    cx.drawImage(bodyImg, 0, 0, W, H);
    cx.globalCompositeOperation = 'destination-out';
    for (const h of await Promise.all(hides)) cx.drawImage(h, 0, 0, W, H);
    return c;
  }

  // 가방 끈(strap.png): 어깨~가방 윗변. 가방 본체는 팔이 빠진 채 상의 위, 끈은 맨 위에 그린다(정렬 공정 5)
  async function strapImages(stack) {
    const out = [];
    if (state.fixtureMode) return out;
    for (const e of stack) {
      if (e.kind !== 'item' || e.layerId !== 'bag') continue;
      const w = catalog.wearable(e.item, base, null);
      const a = w.ok && w.fit && w.fit.asset;
      if (!a || !a.strap) continue;
      let img = await loadImage(a.strap);
      if (e.colorway && e.colorway.mode === 'tint') {
        img = tinted(`strap:${base.baseId}:${e.item.itemId}:${e.colorway.colorwayId}`, img, e.colorway.hex,
          a.strapMask ? await loadImage(a.strapMask) : null, a.strapProtect ? await loadImage(a.strapProtect) : null);
      }
      out.push(img);
    }
    return out;
  }

  // 아우터 뒷판(안감): 앞이 열린 코트는 다리 사이로 뒷판이 보여야 한다 → 몸보다 뒤에 깐다(tools/outer_back.py가 만든 back.png)
  async function withOuterBack(stack, bodyImg) {
    const e = stack.find((x) => x.layerId === 'outer' && x.kind === 'item');
    if (!e || state.fixtureMode) return bodyImg;
    const w = catalog.wearable(e.item, base, null);
    const a = w.ok && w.fit && w.fit.asset;
    if (!a || !a.back) return bodyImg;
    let back = await loadImage(a.back);
    if (e.colorway && e.colorway.mode === 'tint') back = tinted(`back:${base.baseId}:${e.item.itemId}:${e.colorway.colorwayId}`, back, e.colorway.hex, null, null);
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const cx = c.getContext('2d');
    cx.drawImage(back, 0, 0, W, H);
    cx.drawImage(bodyImg, 0, 0, W, H);
    return c;
  }

  // 아우터를 입으면 그 밑 상의·원피스는 아우터 좌우 폭 밖으로 나오지 않게 자른다
  // (반팔 소매가 블레이저 어깨 밖으로 삐져나오는 것 방지 — 앞섶 사이로 보이는 안쪽 옷은 그대로)
  const clipCache = new WeakMap();
  function outerSpan(img) {
    if (!clipCache.has(img)) {
      const a = toImageData(img).data;
      const m = document.createElement('canvas');
      m.width = W; m.height = H;
      const mx = m.getContext('2d');
      mx.fillStyle = '#000';
      for (let y = 0; y < H; y++) {
        let l = -1, r = -1;
        for (let x = 0; x < W; x++) if (a[(y * W + x) * 4 + 3] > 128) { if (l < 0) l = x; r = x; }
        if (l < 0) mx.fillRect(0, y, W, 1); // 아우터가 없는 줄은 자르지 않음
        else mx.fillRect(l, y, r - l + 1, 1);
      }
      clipCache.set(img, m);
    }
    return clipCache.get(img);
  }
  function clipUnderOuter(stack, imgs) {
    const oi = stack.findIndex((e) => e.layerId === 'outer');
    if (oi < 0 || !imgs[oi]) return;
    const span = outerSpan(imgs[oi]);
    stack.forEach((e, i) => {
      if (i >= oi || !imgs[i] || !['top', 'dress'].includes(e.layerId)) return;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const cx = c.getContext('2d');
      cx.drawImage(imgs[i], 0, 0, W, H);
      cx.globalCompositeOperation = 'destination-in';
      cx.drawImage(span, 0, 0);
      imgs[i] = c;
    });
  }

  // ── 장면에 어울리게: 배경 → 발밑 그림자 → 장면 빛으로 물든 인물 ──
  // 빛 색은 배경 그림에서 인물 둘레의 평균색을 자동으로 뽑는다(장면마다 손으로 정하지 않음)
  const sceneTone = new Map();
  function toneOf(bg) {
    if (!sceneTone.has(bg)) {
      const d = toImageData(bg, 64, 96).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let y = 12; y < 84; y++) for (let x = 14; x < 50; x++) { const i = (y * 64 + x) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
      r /= n; g /= n; b /= n;
      const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      const k = 0.5 / Math.max(lum, 0.05); // 밝기를 0.5로 맞춘 '빛 색'(소프트라이트에서 색만 입힌다)
      sceneTone.set(bg, { color: `rgb(${Math.min(255, r * k)},${Math.min(255, g * k)},${Math.min(255, b * k)})`, lum });
    }
    return sceneTone.get(bg);
  }
  const feetCache = new WeakMap();
  function feetOf(baseImg) { // 기준 인물의 발 위치(맨 아래 불투명 줄들의 가로 범위)
    if (!feetCache.has(baseImg)) {
      const a = toImageData(baseImg).data;
      let bottom = 0;
      for (let y = H - 1; y > 0 && !bottom; y--) for (let x = 0; x < W; x += 2) if (a[(y * W + x) * 4 + 3] > 128) { bottom = y; break; }
      let l = W, r = 0;
      for (let y = bottom - 40; y <= bottom; y++) for (let x = 0; x < W; x += 2) if (a[(y * W + x) * 4 + 3] > 128) { l = Math.min(l, x); r = Math.max(r, x); }
      let top = 0;
      for (let y = 0; y < H && !top; y++) for (let x = 0; x < W; x += 2) if (a[(y * W + x) * 4 + 3] > 128) { top = y; break; }
      feetCache.set(baseImg, { cx: (l + r) / 2, w: Math.max(120, r - l), y: bottom, top });
    }
    return feetCache.get(baseImg);
  }
  async function placeInScene(ctx, sc, baseImg, cam) {
    const dx = (cam && cam.dx) || 0, flip = !!(cam && cam.flip);
    const person = document.createElement('canvas');
    person.width = W; person.height = H;
    const pc = person.getContext('2d');
    pc.drawImage(ctx.canvas, 0, 0);
    const bg = await loadImage(sc.asset.src);
    const tone = toneOf(bg);
    const dark = Math.max(0, Math.min(1, (0.5 - tone.lum) / 0.4)); // 장면이 어두울수록 1에 가까움
    const rainy = sc.weather === '비';
    // 인물을 장면 빛으로 물들이기: 소프트라이트로 빛 색을 입힌 것을 45% 섞는다
    const lit = document.createElement('canvas');
    lit.width = W; lit.height = H;
    const lc = lit.getContext('2d');
    lc.drawImage(person, 0, 0);
    lc.globalCompositeOperation = 'soft-light';
    lc.fillStyle = tone.color; lc.fillRect(0, 0, W, H);
    lc.globalCompositeOperation = 'destination-in';
    lc.drawImage(person, 0, 0);
    pc.globalAlpha = sc.grade ?? 0.45;
    pc.drawImage(lit, 0, 0);
    pc.globalAlpha = 1;
    // 어두운 장면(밤·비)은 인물을 조금 더 어둡고 차갑게, 비 오는 날은 채도를 살짝 낮춘다(얼굴이 묻히지 않게 약하게)
    if (dark > 0.02 || rainy) {
      const cool = document.createElement('canvas');
      cool.width = W; cool.height = H;
      const cc = cool.getContext('2d');
      cc.drawImage(person, 0, 0);
      cc.globalCompositeOperation = 'source-atop';
      cc.fillStyle = `rgba(28,42,80,${0.22 * dark})`; cc.fillRect(0, 0, W, H); // 차가운 남색 살짝
      cc.fillStyle = `rgba(0,0,0,${0.16 * dark})`; cc.fillRect(0, 0, W, H); // 어둡게
      if (rainy) { cc.fillStyle = 'rgba(128,132,140,0.16)'; cc.fillRect(0, 0, W, H); } // 회색을 섞어 채도 낮춤
      pc.save();
      pc.globalCompositeOperation = 'source-over';
      pc.clearRect(0, 0, W, H);
      pc.drawImage(cool, 0, 0);
      pc.restore();
    }
    // 배경(비율이 다르면 잘라서 꽉 채움) + 발밑 그림자 + 인물
    ctx.clearRect(0, 0, W, H);
    const k = Math.max(W / bg.naturalWidth, H / bg.naturalHeight);
    const dw = bg.naturalWidth * k, dh = bg.naturalHeight * k;
    ctx.drawImage(bg, (W - dw) / 2, H - dh, dw, dh);
    const f = feetOf(baseImg);
    ctx.save();
    const soft = Math.max(dark, rainy ? 0.6 : 0); // 밤·비: 그림자를 더 옅고 넓고 부드럽게
    ctx.filter = `blur(${14 + 8 * soft}px)`;
    ctx.fillStyle = `rgba(45,30,20,${(0.28 + 0.15 * (1 - tone.lum)) * (1 - 0.4 * soft)})`;
    ctx.beginPath();
    ctx.ellipse(f.cx + dx, f.y - 6, f.w * (0.62 + 0.18 * soft), 22 + 6 * soft, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // 인물: 위치 이동·좌우 반전(발 자리를 축으로 — 배경은 그대로)
    ctx.save();
    ctx.translate(f.cx + dx, 0);
    if (flip) ctx.scale(-1, 1);
    ctx.translate(-f.cx, 0);
    ctx.drawImage(person, 0, 0);
    ctx.restore();
  }

  // 촬영 구도: 캔버스를 위쪽 기준으로 확대해 잘라낸다(전신 = 그대로)
  function cameraFor(shotCfg, baseImg) {
    const k = (FRAMINGS.find((f) => f[0] === shotCfg.framing) || FRAMINGS[0])[2];
    const fw = W / k, fh = H / k;
    const x0 = (W - fw) / 2;
    const y0 = Math.max(0, Math.min(H - fh, feetOf(baseImg).top - 0.06 * fh));
    return { k, fw, fh, x0, y0, dx: shotCfg.pos * 0.18 * fw, flip: shotCfg.flip };
  }
  function applyCrop(ctx, cam) {
    if (cam.k === 1) return;
    const tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = H;
    tmp.getContext('2d').drawImage(ctx.canvas, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(tmp, cam.x0, cam.y0, cam.fw, cam.fh, 0, 0, W, H);
  }

  // 전신 위 얼굴 부위: 고른 조각을 한 장(전신 크기)에 모은다
  async function faceLayer() {
    if (base.faceParts === false) return null; // 이 자세는 얼굴 위치를 아직 안 맞춤 → 기본 얼굴
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const cx = c.getContext('2d');
    const [ox, oy] = base.headOffset || [0, 0];
    for (const sl of faceSlotsInDrawOrder()) {
      const o = faceOption(sl.slotId, state.face[sl.slotId]);
      if (!o || !o.asset) continue;
      cx.drawImage(await loadImage(o.asset.body.src), o.asset.body.x + ox, o.asset.body.y + oy);
    }
    return c;
  }

  // 얼굴 크게 보기: 클로즈업 기준 + 고른 부위(클로즈업 조각)
  async function renderFace(ctx) {
    const fc = DYS.face.closeup;
    const v = fc.view || { x: 0, y: 0, w: fc.width };
    const k = W / v.w;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.scale(k, k);
    ctx.translate(-v.x, -v.y);
    let face = await loadImage(fc.src);
    if (hairColor().palette && fc.hairMask) face = await hairTinted('hair:closeup', face, fc.hairMask, fc.width, fc.height);
    ctx.drawImage(face, 0, 0);
    for (const sl of faceSlotsInDrawOrder()) {
      const o = faceOption(sl.slotId, state.face[sl.slotId]);
      if (o && o.asset) ctx.drawImage(await loadImage(o.asset.closeup.src), o.asset.closeup.x, o.asset.closeup.y);
    }
    ctx.restore();
    return true;
  }

  // shot: 촬영 화면 설정(없으면 드레스룸 화면: 기본 장면 · 전신). view: 전신/얼굴 크게(촬영은 항상 전신)
  async function renderTo(ctx, outfit, shot, view = state.view) {
    if (view === 'face' && !shot) return renderFace(ctx);
    if (shot && !state.fixtureMode) { // 촬영 자세 그림이 없는 옷은 빼고 그린다
      outfit = Object.fromEntries(Object.entries(outfit).filter(([, p]) => catalog.wearable(catalog.item(p.itemId), base, null).ok));
    }
    const stack = DYS.buildLayerStack(catalog, outfit);
    stack[0].covered = stack.some((e) => e.layerId === 'bottom' || e.layerId === 'dress');
    if (!state.fixtureMode && base.asset) stack.splice(1, 0, { layerId: 'face', kind: 'face' });
    const imgs = await Promise.all(stack.map(resolveEntry));
    clipUnderOuter(stack, imgs);
    const hasBase = !!imgs[0];
    const bodyWithBack = hasBase ? await withOuterBack(stack, await withHidden(stack, imgs[0])) : null;
    DYS.drawStack(ctx, stack, (e) => (!hasBase ? null : e.kind === 'base' ? bodyWithBack : imgs[stack.indexOf(e)]));
    if (!hasBase) return false;
    for (const st of await strapImages(stack)) DYS.drawWithShadow(ctx, st);
    const sc = shot ? (catalog.scene(shot.sceneId) || dressScene()) : dressScene();
    const cam = shot ? cameraFor(shot, imgs[0]) : null;
    if (sc && sc.asset) await placeInScene(ctx, sc, imgs[0], cam);
    if (cam) applyCrop(ctx, cam);
    return true;
  }


  // ── 무대 ──────────────────────────────────────────
  const stage = $('#stage');
  stage.width = W; stage.height = H;
  const overlayCanvas = $('#overlay');
  overlayCanvas.width = W; overlayCanvas.height = H;
  const shotNow = () => (state.screen === 'shoot' ? shoot : undefined);

  let drawSeq = 0;
  async function drawStage() {
    const seq = ++drawSeq;
    const buf = document.createElement('canvas');
    buf.width = W; buf.height = H;
    const ok = await renderTo(buf.getContext('2d'), state.outfit, shotNow());
    if (seq !== drawSeq) return; // 더 최근 요청이 있으면 버린다
    const missing = state.screen === 'shoot' && !state.fixtureMode
      ? Object.values(state.outfit).filter((p) => !catalog.wearable(catalog.item(p.itemId), base, null).ok).length : 0;
    $('#shoot-note').hidden = !missing;
    $('#shoot-note').textContent = `${missing}벌은 이 자세 그림 준비 중이라 빠졌어요`;
    const sctx = stage.getContext('2d');
    sctx.clearRect(0, 0, W, H);
    sctx.drawImage(buf, 0, 0);
    $('#stage-empty').hidden = ok;
    $('#fixture-flag').hidden = !(DEV && ok && state.fixtureMode);
    $('#base-flag').hidden = !(DEV && ok && !state.fixtureMode && base.status !== 'ready');
    $('#stage-empty-title').textContent = `기준 인물 · ${base.label}`;
    $('#stage-empty-status').replaceChildren(badge(base.status));
    $('#btn-save').disabled = !ok;
    const octx = overlayCanvas.getContext('2d');
    octx.clearRect(0, 0, W, H);
    if (state.overlay) {
      overlayCanvas.style.opacity = state.overlay.opacity;
      // 비율이 다르면 늘이지 않고 가운데·아래 맞춤으로 얹는다
      const { img } = state.overlay;
      const k = Math.min(W / img.naturalWidth, H / img.naturalHeight);
      const dw = img.naturalWidth * k, dh = img.naturalHeight * k;
      octx.drawImage(img, (W - dw) / 2, H - dh, dw, dh);
    }
  }

  // 잠깐 뜨는 안내
  let toastTimer = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }

  // ── 옷 고르기 ─────────────────────────────────────
  // 그림이 없는(기획) 옷은 ?dev 에서만 보인다
  // 보류(hold) 옷은 지우지 않고 데이터에 남기되, 옷장에는 ?dev 에서만 보인다
  const pool = () => catalog.data.wardrobe.filter((i) => DEV || (i.status !== 'planned' && !i.hold));
  // 옷장: 기본 옷장 = tier 'basic', 테마 옷장 = 그 테마의 itemRefs. 지금 자세에 그림이 없는 옷은 ?dev 에서만 보인다
  const inCloset = (i) => {
    if (state.closet === 'basic') return i.tier === 'basic';
    const t = catalog.theme(state.closet);
    return !!(t && t.itemRefs.includes(i.itemId));
  };
  const closetPool = () => pool().filter((i) => inCloset(i) && (DEV || catalog.wearable(i, base, fixtureSet()).ok));
  const closetThemes = () => catalog.data.themes.filter((t) => t.status !== 'planned');
  const themeShort = (t) => { const p = (t.title.split(':')[1] || '').trim(); return p ? `${t.subtitle.split('·')[0].trim()} ${p}` : t.title; };
  const isItemTab = () => state.tab !== 'hair' && state.tab !== 'face';

  function visibleItems() {
    const f = state.filter;
    let list = closetPool().filter((i) => i.category === state.tab);
    if (f.mode === 'fav') list = list.filter((i) => favs.has(i.itemId));
    if (f.mode === 'recent') list = recent.map((id) => list.find((i) => i.itemId === id)).filter(Boolean);
    if (f.styles.length) list = list.filter((i) => (i.styles || []).some((s) => f.styles.includes(s)));
    if (state.tab === 'bottom' && f.lengths.length) list = list.filter((i) => f.lengths.includes(extraOf(i.itemId).length));
    // 지금 입어볼 수 있는 옷을 앞에
    const can = (i) => (catalog.wearable(i, base, fixtureSet()).ok ? 0 : 1);
    return list.map((x, n) => [x, n]).sort((a, b) => can(a[0]) - can(b[0]) || a[1] - b[1]).map((x) => x[0]);
  }

  // 썸네일 주소: 한 파일 빌드·앱 빌드는 묶음 표에서, 개발 중에는 그냥 경로
  function thumbUrl(itemId) {
    const p = `assets/thumbs/${itemId}.webp`;
    const e = (DYS.inlineAssets && DYS.inlineAssets[p]) || (DYS.assetManifest && DYS.assetManifest[p]) || p;
    return typeof e === 'string' ? e : (e.d || e.src);
  }

  function toggleFav(itemId, wrap) {
    if (favs.has(itemId)) favs.delete(itemId); else favs.add(itemId);
    saveFavs();
    const on = favs.has(itemId);
    if (wrap) {
      const h = wrap.querySelector('.fav');
      h.classList.toggle('on', on); h.setAttribute('aria-pressed', String(on)); h.textContent = on ? '♥' : '♡';
    }
    if (state.filter.mode === 'fav' && !on) renderAll();
  }

  function itemCard(item) {
    const w = catalog.wearable(item, base, fixtureSet());
    const fixed = isFixed(item);
    const canPick = w.ok && swappable(item) && !fixed;
    const picked = state.outfit[item.category]?.itemId === item.itemId;
    const wrap = el('div', { class: `item-wrap${canPick ? '' : ' off'}` });
    const thumb = el('img', { class: 'thumb', src: thumbUrl(item.itemId), alt: '', loading: 'lazy', draggable: 'false' });
    thumb.addEventListener('error', () => thumb.replaceWith(el('span', { class: 'thumb-fallback' }, item.label)));
    let timer = 0, long = false;
    const btn = el('button', {
      class: `item${picked ? ' on' : ''}`,
      disabled: !canPick,
      'aria-pressed': String(picked),
      'aria-label': `${item.label}${picked ? ' · 입는 중, 누르면 벗기' : ''}${canPick ? '' : ' · 준비 중'}`,
      onclick: () => {
        if (long) { long = false; return; }
        state.view = 'body'; // 옷을 고르면 전신으로 돌아온다
        if (picked) {
          delete state.outfit[item.category]; // 한 번 더 누르면 벗기
        } else {
          state.outfit[item.category] = { itemId: item.itemId, colorwayId: item.colorways[0].colorwayId };
          pushRecent(item.itemId);
          // 원피스는 상의·하의와 함께 입지 않는다
          if (item.category === 'dress') { delete state.outfit.top; delete state.outfit.bottom; }
          if (item.category === 'top' || item.category === 'bottom') delete state.outfit.dress;
        }
        renderAll();
      },
    }, thumb, el('span', { class: 'item-name' }, item.label),
    DEV ? el('span', { class: 'item-meta' }, badge(item.status), fixed ? '검증판에서 고정' : !swappable(item) ? '검증 범위 밖' : w.ok ? null : w.reason) : null,
    !canPick && !DEV ? el('span', { class: 'why' }, '준비 중') : null);
    // 길게 누르기 = 즐겨찾기
    btn.addEventListener('pointerdown', () => { long = false; clearTimeout(timer); timer = setTimeout(() => { long = true; toggleFav(item.itemId, wrap); }, 550); });
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, () => clearTimeout(timer));
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
    const fav = favs.has(item.itemId);
    wrap.append(btn, el('button', {
      class: `fav${fav ? ' on' : ''}`, 'aria-label': `${item.label} 즐겨찾기`, 'aria-pressed': String(fav),
      onclick: () => toggleFav(item.itemId, wrap),
    }, fav ? '♥' : '♡'));
    return wrap;
  }

  // 오른쪽 세로 아이콘 줄(분류). 누르면 선반이 열리고, 같은 아이콘을 다시 누르면 닫힌다
  const CAT_ICON = { hair: '💇', face: '🙂', top: '👚', bottom: '👖', dress: '👗', outer: '🧥', shoes: '👟', bag: '👜', accessory: '🧣' };
  function openShelf(id) {
    state.tab = id; state.tabPicked = true; state.open = true; state.filter.open = null; state.hairPop = false;
    state.view = (id === 'face' || id === 'hair') ? 'face' : 'body'; // 얼굴·헤어 선반을 여는 동안은 얼굴 크게
    renderAll(true);
  }
  function closeShelf() {
    if (!state.open) return;
    state.open = false; state.filter.open = null; state.hairPop = false; state.view = 'body'; // 분류로 돌아가면 전신
    renderAll();
  }
  // 분류 아이콘: 원화 PNG(assets/icons/<분류>.png). 빌드판은 묶음 표에서, 개발 중에는 그냥 경로. 못 읽으면 이모지로 대신한다
  function iconUrl(id) {
    const p = `assets/icons/${id}.png`;
    const e = (DYS.inlineAssets && DYS.inlineAssets[p]) || (DYS.assetManifest && DYS.assetManifest[p]) || p;
    return typeof e === 'string' ? e : (e.d || e.src);
  }
  function catIcon(id) {
    const img = el('img', { class: 'rail-img', src: iconUrl(id), alt: '', draggable: 'false' });
    img.addEventListener('error', () => img.replaceWith(el('span', { class: 'rail-ico', 'aria-hidden': 'true' }, CAT_ICON[id] || '•')));
    return img;
  }
  function renderTabs() {
    const has = (c) => closetPool().some((i) => i.category === c);
    const cats = Object.keys(catalog.data.categories);
    const tabs = [['hair', '헤어'], ['face', '얼굴'], ...cats.map((c) => [c, catalog.data.categories[c].label])];
    if (!['hair', 'face'].includes(state.tab) && !has(state.tab)) state.tab = cats.find(has) || 'hair'; // 옷장을 바꿨는데 이 분류가 비면 다른 분류로
    const box = $('#cats');
    box.replaceChildren(...tabs.map(([id, label]) => {
      const usable = id === 'hair' || id === 'face' || has(id);
      return el('button', {
        class: `rail-btn${state.tabPicked && id === state.tab ? ' cur' : ''}`, disabled: !usable, 'aria-label': label, title: usable ? label : `${label} · 이 옷장에는 없어요`,
        onclick: () => openShelf(id),
      }, catIcon(id), el('span', { class: 'rail-txt' }, label));
    }));
    const cat = tabs.find((t) => t[0] === state.tab);
    $('#shelf-title').textContent = cat ? cat[1] : '';
  }

  // 아래 떠 있는 줄의 옷장 전환: 기본 옷장 · 테마 옷장(계획 단계 테마는 안 보임). 입고 있는 옷은 그대로
  function renderClosets() {
    const opts = [['basic', '기본 옷장'], ...closetThemes().map((t) => [t.themeId, themeShort(t)])];
    if (!opts.some((o) => o[0] === state.closet)) state.closet = 'basic';
    $('#closets').replaceChildren(...opts.map(([id, label]) => el('button', {
      class: id === state.closet ? 'on' : '', 'aria-pressed': String(id === state.closet),
      onclick: () => { state.closet = id; state.filter.open = null; renderAll(true); },
    }, label)));
  }

  function renderFilters() {
    const f = state.filter, show = isItemTab();
    $('#filters').hidden = !show; $('#items').hidden = !show;
    if (!show) { $('#filter-panel').hidden = true; return; }
    const chip = (label, on, onclick, extra = {}) => el('button', { class: `chip-btn${on ? ' on' : ''}`, 'aria-pressed': String(on), onclick, ...extra }, label);
    const nFilter = f.styles.length + f.lengths.length;
    $('#filters').replaceChildren(
      chip('♥', f.mode === 'fav', () => { f.mode = f.mode === 'fav' ? 'all' : 'fav'; renderAll(true); }, { 'aria-label': '즐겨찾기만 보기', title: '즐겨찾기' }),
      chip('🕘', f.mode === 'recent', () => { f.mode = f.mode === 'recent' ? 'all' : 'recent'; renderAll(true); }, { 'aria-label': '최근에 입은 옷', title: '최근' }),
      chip(nFilter ? `⚙${nFilter}` : '⚙', f.open === 'filter' || nFilter > 0, () => { f.open = f.open === 'filter' ? null : 'filter'; renderFilters(); }, { 'aria-label': '스타일·길이 필터', title: '스타일·길이 필터', 'aria-expanded': String(f.open === 'filter') }));
    const panel = $('#filter-panel');
    panel.hidden = f.open !== 'filter';
    const toggleIn = (arr, v) => { const i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1); renderAll(true); };
    if (f.open === 'filter') {
      panel.replaceChildren(
        el('p', { class: 'pop-head' }, '스타일'),
        ...Object.entries(DYS.taxonomy.styles).map(([k, label]) => chip(label, f.styles.includes(k), () => toggleIn(f.styles, k))),
        ...(state.tab === 'bottom' ? [el('p', { class: 'pop-head' }, '길이'), ...DYS.taxonomy.lengths.map((v) => chip(v, f.lengths.includes(v), () => toggleIn(f.lengths, v)))] : []));
    }
  }

  function renderItems() {
    if (!isItemTab()) return;
    const list = visibleItems();
    const f = state.filter;
    const filtered = f.mode !== 'all' || f.styles.length || f.lengths.length;
    $('#items').replaceChildren(...(list.length ? list.map(itemCard) : [el('p', { class: 'empty-note' },
      f.mode === 'fav' ? '♡를 눌러 즐겨찾기한 옷이 여기에 모여요.' : f.mode === 'recent' ? '아직 입어 본 옷이 없어요.' : filtered ? '조건에 맞는 옷이 없어요.' : '아직 이 종류의 옷이 없어요.')]));
  }

  // 지금 고른 옷의 색
  function renderColors() {
    const box = $('#colors');
    const pick = isItemTab() && state.outfit[state.tab];
    const item = pick && catalog.item(pick.itemId);
    box.hidden = !(item && item.colorways && swappable(item));
    if (box.hidden) return;
    const wearNow = catalog.wearable(item, base, fixtureSet()).ok;
    box.replaceChildren(
      el('span', { class: 'colors-label' }, '색'),
      ...item.colorways.map((c) => el('button', {
        class: `dot${c.colorwayId === pick.colorwayId ? ' on' : ''}`,
        disabled: !wearNow,
        'aria-pressed': String(c.colorwayId === pick.colorwayId),
        'aria-label': c.label,
        title: c.label,
        onclick: () => { pick.colorwayId = c.colorwayId; state.view = 'body'; renderAll(); },
      }, el('span', { class: 'chip', style: `background:${c.hex}` }))));
  }

  // ── 체형·자세(개발용) ──────────────────────────────
  function renderPoses() {
    const t = catalog.theme(state.themeId);
    const ids = ['front-neutral', ...((t && t.poseRefs) || [])];
    $('#poses').replaceChildren(...ids.map((id) => {
      const pose = catalog.data.poses.find((p) => p.poseId === id);
      const target = catalog.data.bases.find((b) => b.poseId === id && b.bodyId === base.bodyId && b.asset);
      return el('button', {
        class: base.poseId === id ? 'on' : '', 'aria-pressed': String(base.poseId === id), disabled: !target,
        title: target ? pose.note : '이 체형은 이 자세 그림 대기',
        onclick: () => { base = target; state.view = 'body'; renderAll(); },
      }, pose.label);
    }));
  }

  function renderBodies() {
    const same = catalog.data.bases.filter((b) => b.poseId === base.poseId);
    $('#bodies').hidden = same.length < 2; // 체형이 하나뿐이면 숨김
    const bodyLabel = (b) => (catalog.data.bodies.find((x) => x.bodyId === b.bodyId) || {}).label || b.bodyId;
    $('#bodies').replaceChildren(...same.map((b) => el('button', {
      class: b.baseId === base.baseId ? 'on' : '',
      'aria-pressed': String(b.baseId === base.baseId),
      disabled: !b.asset,
      title: `${b.label} · ${DYS.STATUS[b.status].label}`,
      onclick: () => { base = b; state.view = 'body'; renderAll(); },
    }, bodyLabel(b))));
  }

  // ── 얼굴 부위 ─────────────────────────────────────
  function renderFacePanel() {
    const show = state.tab === 'face';
    $('#face-slots').hidden = !show; $('#face-options').hidden = !show;
    if (!show) return;
    $('#face-slots').replaceChildren(...DYS.face.slots.map((sl) => el('button', {
      class: sl.slotId === state.faceSlot ? 'on' : '', 'aria-pressed': String(sl.slotId === state.faceSlot),
      onclick: () => { state.faceSlot = sl.slotId; renderAll(true); },
    }, sl.label)));
    const sl = DYS.face.slots.find((x) => x.slotId === state.faceSlot);
    $('#face-options').replaceChildren(...sl.options.map((o) => {
      const on = state.face[sl.slotId] === o.partId;
      const usable = o.status === 'ready' || o.status === 'unverified';
      return el('button', {
        class: `face-opt${on ? ' on' : ''}`, 'aria-pressed': String(on), disabled: !usable,
        title: usable ? o.label : '준비 중',
        onclick: () => { state.face[sl.slotId] = o.partId; state.view = 'face'; renderAll(); },
      }, o.label, usable ? null : (DEV ? badge(o.status) : el('span', { class: 'why' }, '준비 중')));
    }));
  }

  // ── 헤어(스타일·색) ────────────────────────────────
  function renderHair() {
    const show = state.tab === 'hair';
    $('#hair-panel').hidden = !show;
    if (!show) return;
    $('#hair-styles').replaceChildren(...DYS.hair.styles.filter((h) => DEV || h.status !== 'planned' || h.priority === 1).map((h) => {
      const usable = h.status === 'ready';
      return el('button', { class: `face-opt${usable ? ' on' : ''}`, disabled: !usable, title: usable ? h.label : '준비 중' }, h.label,
        usable ? null : (DEV ? badge(h.status) : el('span', { class: 'why' }, '준비 중')));
    }));
    // 이 기준 인물에서 쓸 수 있는 색만(원래 색 · 이 자세용 그림이 있는 색 · 마스크로 칠할 수 있는 색)
    const canTint = !!(base.asset && base.asset.hairMask);
    const colors = DYS.hair.colors.filter((c) => c.mode === 'original' || (canTint && c.palette));
    if (!colors.includes(hairColor())) state.hairColor = colors[0].colorId;
    $('#hair-colors').replaceChildren(...colors.map((c) => el('button', {
      class: `swatch${c.colorId === state.hairColor ? ' on' : ''}`,
      'aria-pressed': String(c.colorId === state.hairColor),
      title: c.label, 'aria-label': c.label,
      onclick: () => { state.hairColor = c.colorId; state.view = 'face'; renderAll(); },
    }, el('span', { class: 'chip', style: `background:${c.hex}` }))));
    // 미세 조절(원래 색일 때는 숨김)
    const sliders = [['brightness', '밝기'], ['saturation', '채도'], ['warmth', '차갑게 · 따뜻하게']];
    const canAdj = !!hairColor().palette;
    if (!canAdj) state.hairPop = false;
    $('#hair-adj-btn').hidden = !canAdj;
    $('#hair-adj-btn').setAttribute('aria-expanded', String(state.hairPop));
    $('#hair-adj-btn').classList.toggle('on', state.hairPop);
    $('#hair-adjust').hidden = !(canAdj && state.hairPop && state.open);
    $('#hair-adjust').replaceChildren(...sliders.map(([k, label]) => el('label', { class: 'hair-slider' }, label,
      el('input', { type: 'range', min: -10, max: 10, step: 1, value: state.hairAdjust[k],
        onchange: (ev) => { state.hairAdjust[k] = Number(ev.target.value); drawStage(); } }))),
    el('button', { class: 'ghost small', onclick: () => { state.hairAdjust = { ...DYS.hair.adjust }; renderAll(); } }, '되돌리기'));
  }

  $('#hair-adj-btn').addEventListener('click', () => { state.hairPop = !state.hairPop; renderHair(); });

  // ── 진행표(?dev) ──────────────────────────────────
  function renderProgress() {
    if (!DEV) return;
    const rows = catalog.progress();
    $('#progress').replaceChildren(
      el('table', {},
        el('tbody', {}, rows.map((r) => el('tr', {},
          el('td', { class: 'muted' }, r.kind), el('td', {}, r.label), el('td', {}, badge(r.status)))))),
      el('p', { class: check.errors.length ? 'err' : 'ok' },
        check.errors.length ? `데이터 오류 ${check.errors.length}건: ${check.errors.join(' / ')}` : `데이터 자체 검사 통과 · 참고 ${check.warnings.length}건`),
    );
  }

  // ── 촬영 화면 ─────────────────────────────────────
  function renderShoot() {
    const sc = catalog.scene(shoot.sceneId);
    $('#shoot-title').textContent = sc ? sc.label : '';
    const seg = (items, isOn, pick) => items.map(([v, label]) => el('button', { class: isOn(v) ? 'on' : '', 'aria-pressed': String(isOn(v)), onclick: () => { pick(v); renderAll(); } }, label));
    const places = shootPlaces();
    if (places.length && !places.some((p) => p.scenes.some((x) => x.sceneId === shoot.sceneId))) shoot.sceneId = places[0].scenes[0].sceneId;
    const curPlace = sc ? placeOf(sc) : null;
    $('#shoot-scenes').replaceChildren(...seg(places.map((p) => [p.place, p.place]), (v) => v === curPlace, (v) => { // 장소를 바꾸면 그 장소의 첫 변형
      const p = places.find((q) => q.place === v); if (p) shoot.sceneId = p.scenes[0].sceneId;
    }));
    const cur = places.find((p) => p.place === curPlace);
    const vars = cur && cur.scenes.length > 1 ? cur.scenes : [];
    $('#shoot-variants').replaceChildren(...seg(vars.map((x) => [x.sceneId, variantLabel(x, vars)]), (v) => v === shoot.sceneId, (v) => { shoot.sceneId = v; }));
    $('#shoot-framing').replaceChildren(...seg(FRAMINGS.map((f) => [f[0], f[1]]), (v) => v === shoot.framing, (v) => { shoot.framing = v; }));
    $('#shoot-pos').replaceChildren(...seg(POSITIONS, (v) => v === shoot.pos, (v) => { shoot.pos = v; }));
    // 아래 아이콘 줄: 누르면 그 선택지가 한 줄로 펼쳐진다(같은 아이콘을 다시 누르면 접힘). 반전은 바로 켜고 끈다
    const icons = [['scene', '📍', '장소'], ...(vars.length ? [['variant', '🕒', '시간']] : []), ['framing', '🔍', '구도'], ['pos', '↔', '위치']];
    if (!icons.some((x) => x[0] === state.shootOpen)) state.shootOpen = null;
    for (const s2 of document.querySelectorAll('.shoot-options .seg')) s2.hidden = s2.dataset.k !== state.shootOpen;
    const ico = (glyph, label, on, onclick) => el('button', { class: `shoot-ico${on ? ' on' : ''}`, 'aria-pressed': String(on), 'aria-label': label, onclick },
      el('span', { class: 'rail-ico', 'aria-hidden': 'true' }, glyph), el('span', { class: 'rail-txt' }, label));
    $('#shoot-icons').replaceChildren(
      ...icons.map(([k, g, label]) => ico(g, label, state.shootOpen === k, () => { state.shootOpen = state.shootOpen === k ? null : k; renderShoot(); })),
      ico('⇋', '반전', shoot.flip, () => { shoot.flip = !shoot.flip; renderAll(); }));
  }

  function setScreen(name) {
    state.screen = name;
    document.body.dataset.screen = name;
    // 촬영 = 테마 자세, 드레스룸 = 정면. 촬영은 항상 전신(얼굴 크게 해제)
    base = name === 'shoot' ? baseForTheme(state.themeId) : dressBase();
    if (name === 'shoot') { state.view = 'body'; state.open = false; state.filter.open = null; state.shootOpen = null; }
    const s = name === 'shoot';
    $('#top-dress').hidden = s; $('#top-shoot').hidden = !s;
    $('#cats').hidden = s; $('#stage-float').hidden = s;
    $('#panel-shoot').hidden = !s;
    if (s) $('#dev-card').hidden = true;
    renderAll();
    requestAnimationFrame(fitStage);
  }

  function renderAll(resetScroll) {
    const sb = $('#sheet-body'), st = sb.scrollTop;
    renderBodies();
    renderPoses();
    renderTabs();
    renderClosets();
    renderFacePanel();
    renderHair();
    renderFilters();
    renderItems();
    renderColors();
    renderProgress();
    renderShoot();
    sb.scrollTop = resetScroll ? 0 : st;
    const shelf = $('#panel-dress'), open = state.open && state.screen === 'dress';
    shelf.classList.toggle('open', open);
    shelf.inert = !open;
    $('#cats').hidden = state.screen !== 'dress' || open;
    $('#btn-face').textContent = state.view === 'face' ? '전신' : '얼굴 크게';
    $('#fixture-toggle').setAttribute('aria-pressed', String(state.fixtureMode));
    $('#fixture-toggle').textContent = state.fixtureMode ? '도형 끄기' : '교체 시험(도형)';
    drawStage();
    fitStage();
  }

  // ── 버튼 ──────────────────────────────────────────
  function toggleFixtures() {
    state.fixtureMode = !state.fixtureMode;
    if (state.fixtureMode && !fixtures) fixtures = DYS.makeFixtures(W, H);
    renderAll();
  }
  $('#fixture-toggle').addEventListener('click', toggleFixtures);
  $('#stage-empty-try').addEventListener('click', toggleFixtures);
  $('#btn-face').addEventListener('click', () => { state.view = state.view === 'face' ? 'body' : 'face'; renderAll(); });
  $('#btn-go-shoot').addEventListener('click', () => setScreen('shoot'));
  $('#shelf-close').addEventListener('click', closeShelf);
  $('#btn-dev').addEventListener('click', () => {
    const d = $('#dev-card');
    d.hidden = !d.hidden;
    $('#btn-dev').setAttribute('aria-expanded', String(!d.hidden));
  });
  // 무대 빈 곳을 누르면 선반이 닫힌다
  $('#stage-wrap').addEventListener('click', () => { if (state.screen === 'dress') closeShelf(); else if (state.shootOpen) { state.shootOpen = null; renderShoot(); } });
  $('#btn-back').addEventListener('click', () => setScreen('dress'));

  // 사진 저장: 공유 시트(휴대폰) → 안 되면 내려받기
  async function savePhoto() {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    await renderTo(c.getContext('2d'), state.outfit, shoot);
    const photo = document.createElement('canvas');
    photo.width = W; photo.height = H;
    const pctx = photo.getContext('2d');
    pctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--photo-bg').trim() || '#efe9e3';
    pctx.fillRect(0, 0, W, H);
    pctx.drawImage(c, 0, 0);
    const blob = await new Promise((r) => photo.toBlob(r, 'image/png'));
    const d = new Date(), two = (n) => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}${two(d.getMonth() + 1)}${two(d.getDate())}-${two(d.getHours())}${two(d.getMinutes())}${two(d.getSeconds())}`; // 기기 시각
    const name = `dress-your-story-${shoot.sceneId || 'plain'}-${stamp}${state.fixtureMode ? '-시험용' : ''}.png`;
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    toast('사진을 내려받았어요');
  }
  $('#btn-save').addEventListener('click', savePhoto);

  // 원화 겹쳐보기(?dev): 받은 그림을 무대 위에 반투명으로 얹어 정렬을 눈으로 확인(저장 사진에는 안 들어감)
  $('#overlay-file').addEventListener('change', async (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    const img = await loadImage(URL.createObjectURL(f));
    const ratio = img.naturalWidth / img.naturalHeight;
    state.overlay = { img, name: f.name, opacity: 0.5 };
    $('#overlay-info').textContent = `${f.name} · ${img.naturalWidth}×${img.naturalHeight}` +
      (Math.abs(ratio - W / H) > 0.01 ? ` · 기준 ${W}×${H}와 비율이 달라 아래 가운데 맞춤으로 얹음(정렬 전 원본)` : '');
    $('#overlay-tools').hidden = false;
    $('#overlay-range').value = 50;
    drawStage();
    ev.target.value = '';
  });
  $('#overlay-range').addEventListener('input', (ev) => {
    if (!state.overlay) return;
    state.overlay.opacity = ev.target.value / 100;
    overlayCanvas.style.opacity = state.overlay.opacity;
  });
  $('#overlay-off').addEventListener('click', () => {
    state.overlay = null;
    $('#overlay-tools').hidden = true;
    drawStage();
  });

  // ── 내 코디 ───────────────────────────────────────
  const readLooks = () => store.get(KEYS.looks, []);
  let editingLook = null, deletingLook = null, deleteTimer = 0;
  const fmtDate = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const defaultLookName = () => { const d = new Date(); return `${d.getMonth() + 1}월 ${d.getDate()}일 코디`; };

  function openLooks() {
    $('#looks').hidden = false;
    $('#look-name').value = defaultLookName();
    editingLook = deletingLook = null;
    renderLooks();
    $('#looks-close').focus();
  }
  const closeLooks = () => { $('#looks').hidden = true; };

  async function previewOf() {
    const tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = H;
    await renderTo(tmp.getContext('2d'), state.outfit, undefined, 'body');
    const s = document.createElement('canvas');
    s.width = 160; s.height = 240;
    const sx = s.getContext('2d');
    sx.fillStyle = '#efe9e3'; sx.fillRect(0, 0, 160, 240);
    sx.drawImage(tmp, 0, 0, 160, 240);
    return s.toDataURL('image/jpeg', 0.7);
  }

  async function saveLook() {
    const name = $('#look-name').value.trim() || defaultLookName();
    const look = {
      id: `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`,
      name, savedAt: new Date().toISOString(),
      outfit: JSON.parse(JSON.stringify(state.outfit)),
      hairColor: state.hairColor, hairAdjust: { ...state.hairAdjust }, face: { ...state.face },
      preview: await previewOf(),
    };
    if (!store.set(KEYS.looks, [look, ...readLooks()])) { toast('이 기기에서는 코디를 저장할 수 없어요'); return; }
    $('#look-name').value = defaultLookName();
    renderLooks();
    toast('내 코디에 저장했어요');
  }

  function applyLook(look) {
    let skipped = 0;
    base = dressBase(); // 내 코디 불러오기는 드레스룸(정면)에서
    const outfit = {};
    for (const pick of Object.values(look.outfit || {})) {
      const it = pick && catalog.item(pick.itemId);
      if (!it || !swappable(it) || !catalog.wearable(it, base, fixtureSet()).ok) { skipped++; continue; }
      const cw = (it.colorways || []).find((c) => c.colorwayId === pick.colorwayId) || it.colorways[0];
      outfit[it.category] = { itemId: it.itemId, colorwayId: cw.colorwayId };
    }
    if (outfit.dress) { delete outfit.top; delete outfit.bottom; }
    state.outfit = outfit;
    if (DYS.hair.colors.some((c) => c.colorId === look.hairColor)) state.hairColor = look.hairColor;
    state.hairAdjust = { ...DYS.hair.adjust, ...(look.hairAdjust || {}) };
    for (const sl of DYS.face.slots) {
      const o = sl.options.find((x) => x.partId === (look.face || {})[sl.slotId]);
      if (o && (o.status === 'ready' || o.status === 'unverified')) state.face[sl.slotId] = o.partId;
    }
    state.view = 'body';
    closeLooks();
    if (state.screen !== 'dress') setScreen('dress'); else renderAll();
    toast(skipped ? `${skipped}벌은 이 자세 그림이 없어 뺐어요` : '코디를 불러왔어요');
  }

  function renderLooks() {
    const list = readLooks();
    const box = $('#looks-list');
    if (!list.length) { box.replaceChildren(el('p', { class: 'empty-note' }, '아직 저장한 코디가 없어요. 마음에 드는 코디를 저장해 보세요.')); return; }
    const update = (fn) => { store.set(KEYS.looks, fn(readLooks())); renderLooks(); };
    box.replaceChildren(...list.map((look) => {
      const editing = editingLook === look.id;
      const nameInput = el('input', { type: 'text', value: look.name, maxlength: 30, 'aria-label': '코디 이름', class: 'look-edit' });
      const commit = () => { editingLook = null; update((ls) => ls.map((x) => (x.id === look.id ? { ...x, name: nameInput.value.trim() || x.name } : x))); };
      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); });
      return el('div', { class: 'look' },
        look.preview ? el('img', { class: 'look-img', src: look.preview, alt: `${look.name} 미리보기` }) : el('div', { class: 'look-img' }),
        el('div', { class: 'look-main' },
          editing ? nameInput : el('p', { class: 'look-name' }, look.name),
          el('p', { class: 'muted look-date' }, fmtDate(look.savedAt)),
          el('div', { class: 'look-actions' },
            el('button', { class: 'primary small', onclick: () => applyLook(look) }, '불러오기'),
            editing
              ? el('button', { class: 'ghost small', onclick: commit }, '확인')
              : el('button', { class: 'ghost small', onclick: () => { editingLook = look.id; deletingLook = null; renderLooks(); } }, '이름 바꾸기'),
            el('button', {
              class: `ghost small${deletingLook === look.id ? ' danger' : ''}`,
              onclick: () => {
                if (deletingLook === look.id) { deletingLook = null; update((ls) => ls.filter((x) => x.id !== look.id)); return; }
                deletingLook = look.id; renderLooks();
                clearTimeout(deleteTimer); deleteTimer = setTimeout(() => { deletingLook = null; if (!$('#looks').hidden) renderLooks(); }, 3000);
              },
            }, deletingLook === look.id ? '정말 삭제' : '삭제'))));
    }));
    if (editingLook) { const inp = box.querySelector('.look-edit'); if (inp) inp.focus(); }
  }
  $('#btn-looks').addEventListener('click', openLooks);
  $('#looks-close').addEventListener('click', closeLooks);
  $('#looks').addEventListener('click', (e) => { if (e.target === $('#looks')) closeLooks(); });
  $('#look-save').addEventListener('click', saveLook);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#looks').hidden) closeLooks(); });

  // ── 무대 크기 ──
  // 드레스룸: 어떤 상태에서도 화면 전체 높이 · 전신이 그대로(줄이지 않음). 오른쪽 열을 뺀 왼쪽 자리의 가운데에 둔다(세로 화면은 좌우가 잘릴 수 있음).
  // 촬영: 세로 화면은 화면을 꽉 채운다(cover, 좌우는 잘림 · 인물은 가운데). 저장되는 사진(1024×1536)은 그대로.
  const wrap = document.querySelector('.stage-wrap');
  const frame = $('#stage-frame');
  const portraitMQ = window.matchMedia('(orientation: portrait)');
  function fitStage() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    let fw, fh, left;
    if (state.screen === 'shoot') {
      fh = portraitMQ.matches ? Math.max(h, (w * H) / W) : h;
      fw = (fh * W) / H;
      left = (w - fw) / 2;
    } else {
      const colW = parseFloat(getComputedStyle(document.body).getPropertyValue('--col-w')) || 84;
      fh = h; fw = (fh * W) / H;
      left = (w - colW - fw) / 2;
    }
    frame.style.width = `${Math.round(fw)}px`;
    frame.style.height = `${Math.round(fh)}px`;
    frame.style.left = `${Math.round(left)}px`;
    frame.style.top = `${Math.round((h - fh) / 2)}px`;
  }
  if (window.ResizeObserver) new ResizeObserver(fitStage).observe(wrap);
  window.addEventListener('resize', fitStage);
  window.addEventListener('orientationchange', () => setTimeout(fitStage, 200));

  // ── 머리글(데이터에서) ─────────────────────────────
  document.title = cfg.workingTitle;
  $('#brand').textContent = cfg.workingTitle;
  $('#brand-note').textContent = cfg.titleNote;
  $('#milestone').textContent = `첫 검증판 · ${cfg.validation.milestone}`;

  // 검사용 창구(브라우저에서 픽셀 비교할 때 사용)
  DYS.debug = {
    catalog,
    state,
    shoot,
    async renderPixels(outfit, useFixtures) {
      const prev = state.fixtureMode;
      state.fixtureMode = useFixtures;
      if (useFixtures && !fixtures) fixtures = DYS.makeFixtures(W, H);
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      await renderTo(ctx, outfit);
      state.fixtureMode = prev;
      return ctx.getImageData(0, 0, W, H);
    },
    // 확인 그림용: 기준 인물(baseId)에 옷(itemId 목록)을 앱과 똑같이 입혀 캔버스로 돌려준다(배경 장면 없이)
    async renderOutfit(itemIds, baseId) {
      const prevBase = base;
      base = catalog.base(baseId);
      const outfit = {};
      for (const id of itemIds) { const it = catalog.item(id); outfit[it.category] = { itemId: id, colorwayId: it.colorways[0].colorwayId }; }
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      const stack = DYS.buildLayerStack(catalog, outfit);
      stack[0].covered = stack.some((e) => e.layerId === 'bottom' || e.layerId === 'dress');
      if (base.asset) stack.splice(1, 0, { layerId: 'face', kind: 'face' });
      const imgs = await Promise.all(stack.map(resolveEntry));
      clipUnderOuter(stack, imgs);
      const body = await withOuterBack(stack, await withHidden(stack, imgs[0]));
      DYS.drawStack(ctx, stack, (e) => (e.kind === 'base' ? body : imgs[stack.indexOf(e)]));
      for (const st of await strapImages(stack)) DYS.drawWithShadow(ctx, st);
      base = prevBase;
      return c;
    },
    fixtureAlpha(itemId) {
      if (!fixtures) fixtures = DYS.makeFixtures(W, H);
      return toImageData(fixtures.items.get(itemId).image);
    },
  };

  setScreen('dress');
  fitStage();
})();

</script>
  <script>
    // 서비스 워커는 배포 주소(https)에서만 — 개발 서버·파일 하나 미리보기에서는 쓰지 않음
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
