<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DRESS YOUR STORY</title>
  <!-- 웹앱(PWA): 휴대폰에서 '홈 화면에 추가'하면 앱처럼 전체 화면으로 열린다 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f5f1ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="드레스 스토리">
  <link rel="apple-touch-icon" href="pwa/icon-192.png">
  <link rel="icon" href="pwa/icon-192.png">
  <style>
:root {
  --bg: #f5f1ec;
  --card: #fffdfa;
  --ink: #2c2624;
  --muted: #8a7f78;
  --line: #e6ddd4;
  --accent: #b27a74;
  --accent-soft: #f3e3df;
  --stage: #efe8e1;
  --photo-bg: #efe9e3;
  --ok: #4d7a5a;
  --err: #a8453c;
  --s-planned: #ece7e2;   --s-planned-ink: #7c726b;
  --s-art: #f6e6cf;       --s-art-ink: #8a5f22;
  --s-unver: #e4e9f3;     --s-unver-ink: #43577f;
  --s-ready: #dcebdf;     --s-ready-ink: #3d6b49;
  --radius: 14px;
  --serif: "Nanum Myeongjo", "AppleMyungjo", "Noto Serif KR", Georgia, serif;
  --sans: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1a19; --card: #262220; --ink: #f1e9e3; --muted: #a99d95; --line: #3a3431;
    --accent: #d49b94; --accent-soft: #3b2c2a; --stage: #2e2927;
    --s-planned: #34302d; --s-planned-ink: #b9aea6;
    --s-art: #43361f; --s-art-ink: #e8c48e;
    --s-unver: #2c3446; --s-unver-ink: #a9bde6;
    --s-ready: #26382b; --s-ready-ink: #9fd0aa;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
/* 앱 화면: 창 전체가 무대. 머리글·아이콘 줄·선반은 무대 위에 겹쳐 뜬다 */
body {
  background: var(--stage); color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-text-size-adjust: 100%;
  height: 100vh; height: 100dvh; overflow: hidden; position: relative;
  --glass: color-mix(in srgb, var(--card) 82%, transparent);
}
button { font: inherit; color: inherit; }
.muted { color: var(--muted); }

/* 머리글(반투명) */
.top {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; min-height: 52px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: calc(6px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 6px calc(12px + env(safe-area-inset-left));
  background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 78%, transparent), transparent);
  pointer-events: none; transition: right .25s ease;
}
.top > * { pointer-events: auto; }
.brand-box { min-width: 0; }
.brand { font: 600 16px/1.2 var(--serif); letter-spacing: .06em; margin: 0; white-space: nowrap; }
.brand-note { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
.top-right { display: flex; gap: 8px; align-items: center; }
.milestone { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.shoot-title { margin: 0; flex: 1 1 auto; text-align: center; font: 600 16px/1.3 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 3px rgba(255,255,255,.7); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(6px);
  font-size: 20px; line-height: 1; cursor: pointer; display: inline-grid; place-items: center; flex: 0 0 auto;
}
.icon-btn.save { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill-btn {
  min-height: 44px; padding: 4px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(6px);
  cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap;
}

button.primary, button.ghost, .file-btn {
  border-radius: 99px; padding: 8px 16px; min-height: 44px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
}
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.small { min-height: 44px; padding: 4px 12px; font-size: 13px; }
button.danger { border-color: var(--err); color: var(--err); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* 무대: 창 전체. 틀(stage-frame)의 위치·크기는 app.js(fitStage)가 정한다 */
.layout { position: fixed; inset: 0; z-index: 0; }
.stage-col, .stage-wrap { position: absolute; inset: 0; }
.stage-frame {
  position: absolute; left: 0; top: 0; width: 200px; height: 300px; /* 실제 크기·위치는 app.js가 2:3으로 맞춤 */
  background: var(--stage); overflow: hidden;
}
@media (prefers-reduced-motion: no-preference) { .stage-frame { transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease; } }
.stage-frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.overlay { pointer-events: none; }
.fixture-flag {
  position: absolute; top: 60px; left: 10px; font-size: 12px; font-weight: 600;
  padding: 4px 10px; border-radius: 99px; background: var(--s-art); color: var(--s-art-ink);
}
.stage-empty { position: absolute; inset: 0; }
.stage-ref {
  position: absolute; left: 50%; top: 0; height: 100%; transform: translateX(-50%);
  -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent), linear-gradient(to bottom, #000 70%, transparent);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
}
.ref-flag {
  position: absolute; top: 60px; left: 10px; right: 10px; font-size: 11px; font-weight: 600; text-align: center;
  padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.82); color: #6d625c;
}
.empty-card {
  position: absolute; left: 8px; right: 8px; bottom: 80px; text-align: center;
  background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; justify-items: center;
}
.empty-title { margin: 0; font: 600 13px/1.4 var(--serif); }

/* 오른쪽 열: 분류 아이콘 줄(.rail)과 분류별 목록(.sheet)이 같은 자리를 쓴다 */
body { --col-w: 84px; }
.rail, .sheet {
  position: fixed; z-index: 6; right: 0; top: calc(56px + env(safe-area-inset-top)); bottom: 0; width: var(--col-w);
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-left: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: 18px 0 0 0;
  padding-right: env(safe-area-inset-right); padding-bottom: env(safe-area-inset-bottom);
}
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; overflow-y: auto; scrollbar-width: none; padding-top: 8px; padding-bottom: 12px; }
.rail::-webkit-scrollbar { display: none; }
.rail-btn {
  width: 58px; min-height: 58px; flex: 0 0 auto; border-radius: 16px; border: 1px solid var(--line); background: var(--card);
  display: grid; place-items: center; align-content: center; gap: 0; cursor: pointer; padding: 3px 0;
}
.rail-btn:disabled { opacity: .3; }
.rail-ico { font-size: 20px; line-height: 1.15; }
.rail-txt { font-size: 10px; line-height: 1.1; font-weight: 600; }

/* 아래 떠 있는 줄: 옷장 전환 + 촬영 (오른쪽 열 왼쪽에서 가운데) */
.stage-float {
  position: fixed; z-index: 6; left: 8px; right: calc(var(--col-w) + 8px); bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; pointer-events: none;
}
.stage-float > * { pointer-events: auto; }
.closets { display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: var(--glass); backdrop-filter: blur(6px); border: 1px solid var(--line); min-width: 0; }
.closets button { border: 0; background: transparent; border-radius: 99px; padding: 4px 12px; min-height: 40px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.closets button.on { background: var(--ink); color: var(--bg); }
.float-btn {
  min-height: 46px; padding: 6px 14px; white-space: nowrap; border-radius: 99px; cursor: pointer; font-size: 14px; font-weight: 600;
  border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(6px);
}
.float-btn.go { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 분류별 목록 열 */
.sheet { display: none; flex-direction: column; min-height: 0; }
.sheet.open { display: flex; }
.shelf-head { flex: 0 0 auto; display: grid; gap: 2px; justify-items: center; padding: 6px 2px 2px; }
.back-btn { width: 100%; min-height: 40px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.shelf-title { font: 600 12px/1.2 var(--serif); color: var(--muted); }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px; scrollbar-width: none; }
.sheet-body::-webkit-scrollbar { display: none; }

/* 가로로 밀리는 탭(스크롤 막대 숨김) */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; flex: 0 0 auto; -webkit-overflow-scrolling: touch; }
.tabs.scroll::-webkit-scrollbar { display: none; }
.tabs.sub { padding: 0 0 6px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button, .tabs button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 14px; min-height: 44px; cursor: pointer; font-size: 14px; white-space: nowrap; flex: 0 0 auto;
}
.seg button.on, .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 필터(선반 머리 한 줄) */
.filters { display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 4px; flex: 1 1 auto; min-width: 0; }
.filters::-webkit-scrollbar { display: none; }
.filters .chip-btn { flex: 0 0 auto; }
.filter-panel { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 12px 0; padding: 6px; background: var(--bg); border-radius: 12px; flex: 0 0 auto; max-height: 120px; overflow-y: auto; }
.chip-btn {
  border: 1px solid transparent; background: transparent; border-radius: 99px; padding: 4px 11px; min-height: 40px; cursor: pointer; font-size: 13px; white-space: nowrap;
}
.filter-panel .chip-btn { background: var(--card); border-color: var(--line); }
.chip-btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }

/* 썸네일: 세로 화면 = 가로 한 줄(밀기) / 가로 화면 = 격자 */
.items { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; -webkit-overflow-scrolling: touch; }
.items::-webkit-scrollbar { display: none; }
.item-wrap { position: relative; min-width: 0; flex: 0 0 78px; }
.item-wrap.off { opacity: .5; }
.item {
  width: 100%; height: 100%; text-align: center; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 4px 4px 6px;
  display: grid; gap: 2px; align-content: start; cursor: pointer; min-height: 44px;
}
.item.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; background: var(--accent-soft); }
.item:disabled { cursor: default; }
.thumb { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none; }
.thumb-fallback { aspect-ratio: 1; display: grid; place-items: center; font-size: 12px; color: var(--muted); padding: 4px; }
.item-name { font-size: 11px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
.item-meta { font-size: 10px; color: var(--muted); display: grid; gap: 2px; justify-items: center; }
.why { font-size: 11px; color: var(--muted); }
.fav {
  position: absolute; top: 2px; right: 2px; width: 28px; height: 28px; border: 0; background: transparent; color: var(--muted);
  font-size: 16px; line-height: 1; cursor: pointer; padding: 0;
}
.fav::after { content: ""; position: absolute; inset: -8px; }
.fav.on { color: var(--accent); }
.empty-note { flex: 1 1 auto; margin: 16px 0; text-align: center; color: var(--muted); font-size: 13px; }

/* 색 */
.colors { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; padding: 0 12px 4px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.colors::-webkit-scrollbar { display: none; }
.colors-label { font-size: 13px; color: var(--muted); margin-right: 6px; }
.dot { width: 44px; height: 44px; flex: 0 0 auto; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; border-radius: 50%; }
.dot .chip { width: 30px; height: 30px; }
.dot.on .chip { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
.chip { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); display: block; }

/* 얼굴·헤어 */
.face-options { display: flex; flex-wrap: wrap; gap: 8px; }
.face-opt {
  border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 14px; min-height: 44px;
  cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: center;
}
.face-opt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: var(--accent-soft); }
.face-opt:disabled { cursor: default; color: var(--muted); }
.hair-panel { display: grid; gap: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; min-height: 44px;
  border: 1px solid var(--line); background: var(--bg); border-radius: 99px; cursor: pointer; font-size: 13px;
}
.swatch.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.hair-adjust { display: grid; gap: 4px; }
.hair-slider { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.hair-slider input { width: 100%; }

/* 촬영: 오른쪽 세로 아이콘 열(누르면 선택지가 열 왼쪽 팝오버로 펼쳐짐) */
.shoot-bar {
  position: fixed; z-index: 6; right: 0; top: calc(56px + env(safe-area-inset-top)); bottom: 0; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); background: var(--glass); backdrop-filter: blur(10px); border-left: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: 18px 0 0 0;
  padding-right: env(safe-area-inset-right);
}
.shoot-icons { display: flex; flex-direction: column; align-items: center; gap: 6px; overflow-y: auto; min-height: 0; scrollbar-width: none; }
.shoot-icons::-webkit-scrollbar { display: none; }
.shoot-ico, .shoot-save { width: 58px; min-height: 56px; flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 16px; cursor: pointer; display: grid; place-items: center; align-content: center; padding: 2px 0; }
.shoot-save { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.shoot-ico.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.shoot-options { position: absolute; right: 100%; top: 8px; margin-right: 8px; }
.shoot-options .seg {
  width: min(210px, calc(100vw - 100px)); max-height: 60vh; overflow-y: auto; padding: 8px; border-radius: 16px; gap: 6px;
  background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--line);
}
.shoot-options .seg button { min-height: 40px; font-size: 13px; }

/* 개발용(?dev) */
.dev-card { position: fixed; z-index: 9; left: 12px; right: 12px; top: 60px; max-height: calc(100dvh - 80px); overflow-y: auto; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.sec { margin: 8px 0; font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.stage-row { display: flex; gap: 10px; flex-wrap: wrap; }
.overlay-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.overlay-tools p { flex-basis: 100%; margin: 0; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.s-planned { background: var(--s-planned); color: var(--s-planned-ink); }
.s-art-pending { background: var(--s-art); color: var(--s-art-ink); }
.s-unverified { background: var(--s-unver); color: var(--s-unver-ink); }
.s-ready { background: var(--s-ready); color: var(--s-ready-ink); }
#progress table { width: 100%; border-collapse: collapse; font-size: 13px; }
#progress td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
#progress td:last-child { text-align: right; }
.ok { color: var(--ok); font-size: 12px; margin: 10px 0 0; }
.err { color: var(--err); font-size: 12px; margin: 10px 0 0; }

/* 내 코디 */
.looks { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: grid; place-items: end center; }
@media (min-width: 600px) { .looks { place-items: center; } }
.looks-card {
  width: min(480px, 100%); max-height: 85dvh; display: flex; flex-direction: column;
  background: var(--card); border-radius: 20px 20px 0 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 600px) { .looks-card { border-radius: 20px; } }
.looks-head { display: flex; justify-content: space-between; align-items: center; }
.looks-head h2 { margin: 0; font: 600 18px/1.3 var(--serif); }
.looks-save { display: flex; gap: 8px; margin: 8px 0 12px; }
.looks-save input, .look-edit {
  flex: 1 1 auto; min-width: 0; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; background: var(--bg); color: var(--ink); font-size: 16px;
}
.looks-list { overflow-y: auto; display: grid; gap: 10px; -webkit-overflow-scrolling: touch; }
.look { display: flex; gap: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.look-img { width: 64px; height: 96px; object-fit: cover; border-radius: 8px; background: var(--stage); flex: 0 0 auto; }
.look-main { flex: 1 1 auto; min-width: 0; display: grid; gap: 4px; align-content: start; }
.look-name { margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.look-date { margin: 0; font-size: 12px; }
.look-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; max-width: 90vw; pointer-events: none;
}

@media (prefers-reduced-motion: no-preference) {
  .item, .swatch, .chip-btn, .seg button, .tabs button, .rail-btn, .closets button { transition: background-color .15s, border-color .15s; }
}
@media (max-width: 420px) { .ref-flag { font-size: 10px; padding: 3px 8px; } .empty-title { display: none; } }

.shoot-note { position: fixed; z-index: 4; left: 8px; right: 8px; top: calc(56px + env(safe-area-inset-top)); margin: 0; padding: 4px 10px; border-radius: 999px; background: rgba(30,24,20,.62); color: #fff; font-size: 12px; text-align: center; pointer-events: none; }

/* ── 오른쪽 열 안의 목록들(세로 한 줄) ── */
.filters { display: flex; flex-wrap: nowrap; justify-content: center; gap: 1px; width: 100%; overflow: visible; }
.chip-btn { min-height: 38px; min-width: 25px; padding: 2px 3px; border: 1px solid var(--line); background: var(--card); font-size: 12px; }
.filter-panel {
  position: fixed; z-index: 9; right: calc(var(--col-w) + 8px); top: calc(120px + env(safe-area-inset-top)); width: min(210px, calc(100vw - var(--col-w) - 20px)); max-height: 60vh; overflow-y: auto; margin: 0; padding: 8px;
  background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.12);
}
.pop-head { flex: 1 0 100%; margin: 2px 0 0; font-size: 11px; color: var(--muted); font-weight: 600; }
.items { flex-direction: column; overflow: visible; gap: 6px; padding: 0; }
.item-wrap { flex: 0 0 auto; width: 100%; }
.item { padding: 3px 2px 4px; }
.item-name { font-size: 10px; }
.empty-note { font-size: 11px; margin: 10px 0; }
.colors { flex-wrap: wrap; justify-content: center; gap: 0; padding: 4px 4px 6px; max-height: 38%; overflow-y: auto; }
.colors-label { display: none; }
.dot { width: 34px; height: 34px; }
.dot .chip { width: 24px; height: 24px; }
.tabs.sub { flex-direction: column; flex-wrap: nowrap; overflow: visible; gap: 4px; padding: 0 0 6px; }
.tabs.sub button { width: 100%; min-height: 40px; padding: 4px 2px; font-size: 13px; }
.face-options { flex-direction: column; flex-wrap: nowrap; gap: 4px; }
.face-opt { width: 100%; min-height: 40px; padding: 4px 4px; font-size: 12px; justify-content: center; text-align: center; flex-wrap: wrap; line-height: 1.2; }
.swatches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; justify-items: center; }
.swatch { width: 100%; min-height: 40px; padding: 3px; justify-content: center; border-radius: 12px; }
.swatch .chip { width: 26px; height: 26px; }
.hair-panel { gap: 10px; }
#hair-adj-btn.on { background: var(--ink); color: var(--bg); }
.hair-adjust {
  position: fixed; z-index: 9; right: calc(var(--col-w) + 8px); top: calc(120px + env(safe-area-inset-top)); width: min(210px, calc(100vw - var(--col-w) - 20px)); padding: 8px 10px; display: grid; gap: 4px;
  background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.12);
}
.hair-slider { grid-template-columns: 1fr; gap: 0; font-size: 12px; }

@media (orientation: landscape) {
  body { --col-w: 150px; }
  .rail { display: grid; grid-template-columns: repeat(2, 1fr); justify-items: center; align-content: start; }
  .items { display: grid; grid-template-columns: repeat(2, 1fr); }
  .empty-note { grid-column: 1 / -1; }
  .swatches { grid-template-columns: repeat(3, 1fr); }
  .shoot-bar { width: 76px; }
  .stage-float { justify-content: flex-start; left: calc(12px + env(safe-area-inset-left)); }
}
@media (orientation: landscape) and (max-height: 500px) {
  .rail-btn, .shoot-ico, .shoot-save { width: 52px; min-height: 50px; }
  .rail-ico { font-size: 18px; }
  .brand-note { display: none; }
}
@media (max-width: 380px) {
  .brand { font-size: 14px; letter-spacing: .03em; }
  .pill-btn { padding: 4px 10px; }
  .closets button { padding: 4px 9px; font-size: 12px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .shelf-title { display: none; }
  .back-btn { min-height: 34px; }
  .chip-btn { min-height: 34px; }
}
/* 분류 아이콘: 동그란 원화 그림 + 아래 작은 한글 이름. 마지막에 고른 분류는 테두리 강조 */
.rail-btn { background: transparent; border: 1px solid transparent; gap: 1px; padding: 3px 0 2px; }
.rail-img { width: 40px; height: 40px; border-radius: 50%; object-fit: contain; display: block; box-shadow: 0 0 0 1px var(--line); -webkit-user-drag: none; }
.rail-btn.cur { border-color: var(--accent); background: var(--accent-soft); }
.rail-btn.cur .rail-img { box-shadow: 0 0 0 2px var(--accent); }
.rail-btn:disabled .rail-img { filter: grayscale(1); }
@media (orientation: landscape) and (max-height: 500px) { .rail-img { width: 34px; height: 34px; } }

</style>

  <script>
// ── src/core/catalog.js
// 데이터 조회·호환 판정·자체 검사. 화면과 테스트가 함께 쓴다(DOM을 쓰지 않음).
window.DYS = window.DYS || {};

DYS.createCatalog = function createCatalog(d) {
  const byId = (list, key) => new Map(list.map((x) => [x[key], x]));
  const items = byId(d.wardrobe, 'itemId');
  const themes = byId(d.themes, 'themeId');
  const bases = byId(d.bases, 'baseId');
  const scenes = byId(d.scenes, 'sceneId');
  const FILE_STATUSES = ['unverified', 'ready'];

  function themesUsing(itemId) {
    return d.themes.filter((t) => t.itemRefs.includes(itemId));
  }

  // 옷장에 보일 옷: 기본 옷장 + 이 테마가 고른 옷(중복 없이, 테마 옷이 먼저)
  function wardrobeForTheme(themeId) {
    const own = itemsForTheme(themeId);
    return [...own, ...d.wardrobe.filter((i) => i.tier === 'basic' && !own.includes(i))];
  }

  function itemsForTheme(themeId) {
    const t = themes.get(themeId);
    return t ? t.itemRefs.map((id) => items.get(id)).filter(Boolean) : [];
  }

  function sameRig(item, base) {
    return item.bodyId === base.bodyId && item.poseId === base.poseId && item.baseRevision === base.baseRevision;
  }

  // 입힐 수 있는가? fixtures가 주어지면 시험용 도형이 있는 아이템도 허용한다.
  function wearable(item, base, fixtures) {
    if (fixtures) {
      if (fixtures.has(item.itemId)) return { ok: true, source: 'fixture' };
      return { ok: false, reason: item.status === 'planned' ? '기획 단계 · 원화 요청 전' : '시험용 도형 없음' };
    }
    if (base.status !== 'ready') return { ok: false, reason: base.asset ? '기준 인물 승인 전' : '기준 인물 원화 대기' };
    if (item.status === 'planned') return { ok: false, reason: '기획 단계 · 원화 요청 전' };
    const fit = (item.fits || []).find((f) => f.baseId === base.baseId && f.asset);
    if (!fit) return { ok: false, reason: (item.fits || []).length ? '이 체형용 원화 대기' : DYS.STATUS[item.status].label };
    return { ok: true, source: 'asset', fit };
  }

  function validate() {
    const errors = [];
    const warnings = [];
    const dupes = (list, key, what) => {
      const seen = new Set();
      for (const x of list) {
        if (seen.has(x[key])) errors.push(`${what} ID 중복: ${x[key]}`);
        seen.add(x[key]);
      }
    };
    dupes(d.wardrobe, 'itemId', '아이템');
    dupes(d.themes, 'themeId', '테마');
    dupes(d.bases, 'baseId', '기준 인물');
    dupes(d.scenes, 'sceneId', '장면');

    const statusOk = (s) => Object.prototype.hasOwnProperty.call(DYS.STATUS, s);
    const checkAsset = (x, name) => {
      if (!statusOk(x.status)) errors.push(`${name}: 알 수 없는 상태 "${x.status}"`);
      if (x.asset && !FILE_STATUSES.includes(x.status)) errors.push(`${name}: 파일이 없는 상태(${x.status})인데 경로가 적혀 있음`);
      if (FILE_STATUSES.includes(x.status) && !(x.asset && x.asset.src)) errors.push(`${name}: ${x.status} 상태인데 파일 경로가 없음`);
    };

    for (const b of d.bases) checkAsset(b, `기준 인물 ${b.baseId}`);
    for (const it of d.wardrobe) {
      const name = `아이템 ${it.itemId}`;
      if (it.fits) {
        if (it.asset) errors.push(`${name}: fits를 쓰면 asset은 비워 둔다`);
        if (!statusOk(it.status)) errors.push(`${name}: 알 수 없는 상태 "${it.status}"`);
        for (const f of it.fits) {
          const fn = `${name}/${f.baseId}`;
          if (!bases.has(f.baseId)) errors.push(`${fn}: 없는 기준 인물`);
          checkAsset(f, fn);
        }
        if (it.fits.some((f) => f.asset) && !FILE_STATUSES.includes(it.status)) errors.push(`${name}: 그림이 있는데 상태가 ${it.status}`);
      } else {
        checkAsset(it, name);
      }
      if (!d.categories[it.category]) errors.push(`${name}: 알 수 없는 카테고리 "${it.category}"`);
      if (it.status !== 'planned') {
        for (const k of ['bodyId', 'poseId', 'baseRevision']) if (!it[k]) errors.push(`${name}: ${k} 없음`);
        if (!it.colorways || !it.colorways.length) errors.push(`${name}: 색 정보 없음`);
        else if (it.colorways[0].mode !== 'original') errors.push(`${name}: 첫 색은 원화 그대로(original)여야 함`);
      }
      if (it.status === 'ready') {
        const rigOk = it.fits
          ? it.fits.some((f) => f.status === 'ready' && bases.get(f.baseId) && bases.get(f.baseId).status === 'ready')
          : d.bases.some((b) => b.status === 'ready' && sameRig(it, b));
        if (!rigOk) errors.push(`${name}: 준비됨인데 맞는 준비된 기준 인물이 없음`);
        for (const c of it.colorways) {
          const hasMask = it.fits ? it.fits.every((f) => !f.asset || f.asset.mask) : it.asset && it.asset.mask;
          if (c.mode === 'tint' && !hasMask) warnings.push(`${name}/${c.colorwayId}: 색 영역 마스크 없이 전체를 칠함`);
          if (c.mode === 'asset' && !c.src) errors.push(`${name}/${c.colorwayId}: 색별 원화 경로 없음`);
        }
      }
      if (it.tier !== 'basic' && !themesUsing(it.itemId).length) warnings.push(`${name}: 어느 테마에도 연결되지 않음(자유 모드에서만 보임)`);
    }

    // 패션 데이터베이스 분류: taxonomy.js에 있는 값만
    const tx = d.taxonomy;
    if (tx) for (const it of d.wardrobe) {
      const name = `아이템 ${it.itemId}`;
      if (!it.sub || !(tx.subcategories[it.category] || {})[it.sub]) errors.push(`${name}: 세부 종류 "${it.sub}"가 분류표에 없음`);
      if (!tx.tiers[it.tier]) errors.push(`${name}: 옷장 구분 "${it.tier}"가 분류표에 없음`);
      for (const st of it.styles || []) if (!tx.styles[st]) errors.push(`${name}: 스타일 "${st}"가 분류표에 없음`);
      for (const se of it.seasons || []) if (!tx.seasons[se]) errors.push(`${name}: 계절 "${se}"가 분류표에 없음`);
      if (!(it.styles || []).length) errors.push(`${name}: 스타일이 비어 있음`);
    }

    for (const t of d.themes) {
      const name = `테마 ${t.themeId}`;
      if (!statusOk(t.status)) errors.push(`${name}: 알 수 없는 상태 "${t.status}"`);
      for (const id of t.itemRefs) if (!items.has(id)) errors.push(`${name}: 없는 아이템 참조 ${id}`);
      for (const id of t.sceneRefs) if (!scenes.has(id)) errors.push(`${name}: 없는 장면 참조 ${id}`);
      if (t.status === 'ready') {
        const hasScene = t.sceneRefs.some((id) => scenes.get(id)?.status === 'ready');
        const hasItem = t.itemRefs.some((id) => items.get(id)?.status === 'ready');
        if (!hasScene || !hasItem) errors.push(`${name}: 준비됨인데 준비된 장면·아이템이 없음`);
      }
    }

    const v = d.appConfig.validation;
    for (const id of [...v.fixedItems, ...(v.defaultItems || [])]) if (!items.has(id)) errors.push(`기본·고정 아이템 없음: ${id}`);
    if (!bases.has(d.appConfig.activeBaseId)) errors.push(`기준 인물 없음: ${d.appConfig.activeBaseId}`);
    return { errors, warnings };
  }

  // 상태별로 묶은 목록(화면의 진행표와 보고용).
  function progress() {
    const rows = [
      ...d.bases.map((b) => ({ kind: '기준 인물', id: b.baseId, label: b.label, status: b.status })),
      ...d.wardrobe.filter((i) => i.milestone).map((i) => ({ kind: `아이템 ${i.milestone}`, id: i.itemId, label: i.label, status: i.status })),
      ...d.scenes.map((s) => ({ kind: '장면', id: s.sceneId, label: s.label, status: s.status })),
    ];
    return rows;
  }

  return {
    data: d,
    item: (id) => items.get(id),
    wardrobeForTheme,
    theme: (id) => themes.get(id),
    base: (id) => bases.get(id),
    scene: (id) => scenes.get(id),
    themesUsing,
    itemsForTheme,
    wearable,
    validate,
    progress,
  };
};

DYS.collectData = function collectData() {
  return {
    appConfig: DYS.appConfig,
    layers: DYS.layers,
    categories: DYS.categories,
    bodies: DYS.bodies,
    poses: DYS.poses,
    bases: DYS.bases,
    wardrobe: DYS.wardrobe,
    themes: DYS.themes,
    scenes: DYS.scenes,
    taxonomy: DYS.taxonomy,
  };
};

// 코디(선택 상태) → 그릴 레이어 목록. 순수 함수라 화면 없이 테스트할 수 있다.
window.DYS = window.DYS || {};

// outfit: { [category]: { itemId, colorwayId } }
DYS.buildLayerStack = function buildLayerStack(catalog, outfit) {
  const { layers, categories } = catalog.data;
  const order = new Map(layers.map((l, i) => [l.layerId, i]));
  const stack = [{ layerId: 'body', kind: 'base' }];
  for (const [category, pick] of Object.entries(outfit)) {
    if (!pick) continue;
    const cat = categories[category];
    const item = catalog.item(pick.itemId);
    if (!cat || !item) continue;
    const colorway = (item.colorways || []).find((c) => c.colorwayId === pick.colorwayId) || (item.colorways || [])[0];
    stack.push({ layerId: cat.layerId, kind: 'item', item, colorway });
  }
  return stack.sort((a, b) => order.get(a.layerId) - order.get(b.layerId));
};

// 닿는 곳 그림자(10-01): 가방·아우터가 아래 옷·몸에 옅은 그림자를 드리운다(이미 그려진 곳에만 — 배경에는 안 생김).
// 따로 그린 조각을 겹친 티(붙여 놓은 스티커 느낌)를 줄인다. tools/compose_lib.py 와 같은 값.
DYS.SHADOW = { layers: ['outer', 'bag'], strap: true, blur: 10, dx: 3, dy: 6, alpha: 0.45 };
DYS.drawWithShadow = function drawWithShadow(ctx, img) {
  const { width, height } = ctx.canvas;
  const S = DYS.SHADOW;
  const k = width / 1024;
  const off = document.createElement('canvas');
  off.width = width; off.height = height;
  const o = off.getContext('2d');
  // 그림자만 그리기: 그림은 화면 밖에 두고 그림자만 제자리에(모든 브라우저에서 되는 방법)
  o.shadowColor = 'rgba(40,28,24,1)';
  o.shadowBlur = S.blur * k;
  o.shadowOffsetX = width * 4 + S.dx * k;
  o.shadowOffsetY = S.dy * k;
  o.drawImage(img, -width * 4, 0, width, height);
  // 원래 그림 자리는 비운다(그림자는 가장자리 밖으로만)
  o.globalCompositeOperation = 'destination-out';
  o.shadowColor = 'transparent';
  o.drawImage(img, 0, 0, width, height);
  ctx.save();
  ctx.globalCompositeOperation = 'source-atop';
  ctx.globalAlpha = S.alpha;
  ctx.drawImage(off, 0, 0);
  ctx.restore();
  ctx.drawImage(img, 0, 0, width, height);
};

// 그림 그리기. resolve(entry) → 그릴 이미지(없으면 null).
DYS.drawStack = function drawStack(ctx, stack, resolve) {
  const { width, height } = ctx.canvas;
  ctx.clearRect(0, 0, width, height);
  for (const entry of stack) {
    const img = resolve(entry);
    if (!img) continue;
    if (DYS.SHADOW && DYS.SHADOW.layers.includes(entry.layerId) && typeof document !== 'undefined') DYS.drawWithShadow(ctx, img);
    else ctx.drawImage(img, 0, 0, width, height);
  }
};

  };
